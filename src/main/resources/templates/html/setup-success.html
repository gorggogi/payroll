<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password set up - Digital8</title>
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/setupPassword.css}">
</head>
<body>
<div class="setup-container">
    <h2>You're all set!</h2>
    <p class="setup-intro">
        Your password for
        <strong th:text="${setupSuccessEmail}">user@example.com</strong>
        has been set. You can now log into your account.
    </p>

    <a th:href="@{/}" class="btn-submit">Go to login</a>
</div>
</body>
</html>

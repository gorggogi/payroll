<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Up Password - Digital8</title>
    <link rel="stylesheet" th:href="@{/css/global.css}"> 
    <link rel="stylesheet" href="/js/setup.js">
    <style>
        body { background-color: #f4f4f4; font-family: Arial, sans-serif; }
        .setup-container {
            max-width: 400px;
            margin: 100px auto;
            padding: 30px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
        }
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; color: #333; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;}
        .btn-submit { background-color: #000; color: #fff; padding: 12px 20px; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; }
        .btn-submit:hover { background-color: #333; }
        .error-message { color: red; margin-bottom: 15px; font-size: 14px;}
    </style>
</head>
<body>
    <div class="setup-container">
        <h2>Set Up Your Account</h2>
        <p style="color: #666; margin-bottom: 20px;">Please enter a secure permanent password for your Digital8 account.</p>

        <form th:action="@{/setup-password}" method="post" id="setupForm">
            <input type="hidden" name="token" th:value="${token}">

            <div class="form-group">
                <label for="password">New Password</label>
                <input type="password" id="password" name="password" required minlength="8" placeholder="Minimum 8 characters">
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" required placeholder="Re-type your password">
            </div>

            <p id="matchError" class="error-message" style="display: none;">Passwords do not match!</p>

            <button type="submit" class="btn-submit">Set Password</button>
        </form>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Up Password - Digital8</title>
    <link rel="stylesheet" th:href="@{/css/global.css}"> 
    <link rel="stylesheet" href="/js/setup.js">
    <link rel="stylesheet" href="/css/setupPassword.css">
</head>
<body>
    <div class="setup-container">
        <h2>Set Up Your Account</h2>
        <p class="setup-intro">Please enter a secure permanent password for your Digital8 account.</p>

        <form th:action="@{/setup-password}" method="post" id="setupForm">
            <input type="hidden" name="token" th:value="${token}">

            <div class="form-group">
                <label for="password">New Password</label>
                <input type="password" id="password" name="password" required minlength="8" placeholder="Minimum 8 characters">
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" required placeholder="Re-type your password">
            </div>

            <p id="matchError" class="error-message" style="display: none;">Passwords do not match!</p>

            <button type="submit" class="btn-submit">Set Password</button>
        </form>
    </div>
</body>
</html>

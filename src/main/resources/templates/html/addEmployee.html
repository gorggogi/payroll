<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/homeAdmin.css">
    <link rel="stylesheet" href="/css/employees.css">
    <link rel="stylesheet" href="/css/nav.css">
    <script src="https://kit.fontawesome.com/b80e3de11b.js" crossorigin="anonymous"></script>
    <title>Add Employee</title>
</head>
<body>
    <div class="container">
        <nav>
            <ul>
                <h1>Payroll System</h1>
                <a href="/admin/home"><li><i class="fa-solid fa-house"></i>Home</li></a>
                <a href="/admin/employees"><li class="active"><i class="fa-solid fa-people-group"></i>Employees</li></a>
                <a href="/admin/attendance"><li><i class="fa-solid fa-calendar"></i>Attendance</li></a>
                <a href="/admin/deductions"><li><i class="fa-solid fa-minus-circle"></i>Deductions</li></a>
                <a href="/admin/settings"><li><i class="fa-solid fa-gear"></i>Settings</li></a>
            </ul>
            <a href="/logout" class="logout"><i class="fa-solid fa-right-from-bracket"></i>Logout</a>
        </nav>

        <section>
            <div class="head">
                <h1>Add Employee</h1>
                <a href="/admin/employees" class="btn-back"><i class="fa-solid fa-arrow-left"></i> Back to list</a>
            </div>

            <p th:if="${message}" class="alert-success" th:text="${message}"></p>
            <p th:if="${error}" class="alert-error" th:text="${error}"></p>

            <form action="/admin/employees/add" method="post" class="add-employee-form">
                <h3>Personal</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName">First Name *</label>
                        <input type="text" id="firstName" name="firstName" required>
                    </div>
                    <div class="form-group">
                        <label for="middleName">Middle Name *</label>
                        <input type="text" id="middleName" name="middleName" required>
                    </div>
                    <div class="form-group">
                        <label for="lastName">Last Name *</label>
                        <input type="text" id="lastName" name="lastName" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="email">Email *</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="contactNumber">Contact Number *</label>
                        <input type="text" id="contactNumber" name="contactNumber" required>
                    </div>
                    <div class="form-group">
                        <label for="address">Address *</label>
                        <input type="text" id="address" name="address" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="birthDate">Birth Date *</label>
                        <input type="date" id="birthDate" name="birthDate" required>
                    </div>
                    <div class="form-group">
                        <label for="dateHired">Date Hired *</label>
                        <input type="date" id="dateHired" name="dateHired" required>
                    </div>
                </div>

                <h3>Employment</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label for="departmentId">Department *</label>
                        <select id="departmentId" name="departmentId" required>
                            <option value="">Select department</option>
                            <option th:each="d : ${departments}" th:value="${d.departmentId}" th:text="${d.departmentName}"></option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="positionId">Position *</label>
                        <select id="positionId" name="positionId" required>
                            <option value="">Select position</option>
                            <option th:each="p : ${positions}" th:value="${p.positionId}" th:text="${p.positionName}"></option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="employmentStatus">Employment Status *</label>
                        <select id="employmentStatus" name="employmentStatus" required>
                            <option value="Active">Active</option>
                            <option value="Resigned">Resigned</option>
                            <option value="Terminated">Terminated</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="employmentType">Employment Type *</label>
                        <select id="employmentType" name="employmentType" required>
                            <option value="Regular">Regular</option>
                            <option value="Probationary">Probationary</option>
                            <option value="Contractual">Contractual</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="payType">Pay Type *</label>
                        <select id="payType" name="payType" required>
                            <option value="monthly">Monthly</option>
                            <option value="biweekly">Biweekly</option>
                            <option value="daily">Daily</option>
                            <option value="hourly">Hourly</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="basicSalary">Basic Salary *</label>
                        <input type="number" id="basicSalary" name="basicSalary" required min="0" step="0.01" placeholder="0.00">
                    </div>
                </div>

                <h3>Gov't & Bank</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label for="tin">TIN *</label>
                        <input type="text" id="tin" name="tin" required>
                    </div>
                    <div class="form-group">
                        <label for="sssNumber">SSS Number *</label>
                        <input type="text" id="sssNumber" name="sssNumber" required>
                    </div>
                    <div class="form-group">
                        <label for="philhealthNumber">Philhealth Number *</label>
                        <input type="text" id="philhealthNumber" name="philhealthNumber" required>
                    </div>
                    <div class="form-group">
                        <label for="pagibigNumber">Pag-ibig Number *</label>
                        <input type="text" id="pagibigNumber" name="pagibigNumber" required>
                    </div>
                    <div class="form-group">
                        <label for="bank_Account">Bank Account *</label>
                        <input type="text" id="bank_Account" name="bank_Account" required>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-apply"><i class="fa-solid fa-plus"></i> Add Employee</button>
                    <a href="/admin/employees" class="btn-reset" style="text-decoration:none;display:inline-flex;align-items:center;gap:8px;">Cancel</a>
                </div>
            </form>
        </section>
    </div>
</body>
</html>

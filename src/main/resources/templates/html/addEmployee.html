<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/homeAdmin.css">
    <link rel="stylesheet" href="/css/employees.css">
    <link rel="stylesheet" href="/css/nav.css">
    <link rel="icon" type="image/webp" th:href="@{/images/cropped-D8-black-4.webp}">
    <script src="https://kit.fontawesome.com/b80e3de11b.js" crossorigin="anonymous"></script>
    <title>Add Employee</title>
</head>

<body>
    <div class="container">
        <nav th:replace="~{html/fragments/nav :: sidebar}"></nav>

        <section>
            <div class="head">
                <h1>Add Employee</h1>
                <a href="/admin/employees" class="btn-back"><i class="fa-solid fa-arrow-left"></i> Back to list</a>
            </div>

            <p th:if="${message}" class="alert-success" th:text="${message}"></p>
            <p th:if="${error}" class="alert-error" th:text="${error}"></p>

            <form action="/admin/employees/add" method="post" class="add-employee-form">
                <h3>Personal</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName">First Name *</label>
                        <input type="text" id="firstName" name="firstName" required>
                    </div>
                    <div class="form-group">
                        <label for="middleName">Middle Name *</label>
                        <input type="text" id="middleName" name="middleName" required>
                    </div>
                    <div class="form-group">
                        <label for="lastName">Last Name *</label>
                        <input type="text" id="lastName" name="lastName" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="email">Email *</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="biometricId">Biometric ID</label>
                        <input type="text" id="biometricId" name="biometricId" placeholder="e.g. 22">
                    </div>
                    <div class="form-group">
                        <label for="contactNumber">Contact Number *</label>
                        <input type="text" id="contactNumber" name="contactNumber" required>
                    </div>
                    <div class="form-group">
                        <label for="address">Address *</label>
                        <input type="text" id="address" name="address" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="birthDate">Birth Date *</label>
                        <input type="date" id="birthDate" name="birthDate" required>
                    </div>
                    <div class="form-group">
                        <label for="dateHired">Date Hired *</label>
                        <input type="date" id="dateHired" name="dateHired" required>
                    </div>
                </div>

                <h3>Employment</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label for="departmentId">Department *</label>
                        <select id="departmentId" name="departmentId" required>
                            <option value="">Select department</option>
                            <option th:each="d : ${departments}" th:value="${d.departmentId}"
                                th:text="${d.departmentName}"></option>
                            <option value="ADD_NEW">-- Add New Department --</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="positionId">Position *</label>
                        <select id="positionId" name="positionId" required>
                            <option value="">Select position</option>
                            <option th:each="p : ${positions}" th:value="${p.positionId}" th:text="${p.positionName}">
                            </option>
                            <option value="ADD_NEW">-- Add New Position --</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="employmentStatus">Employment Status *</label>
                        <select id="employmentStatus" name="employmentStatus" required>
                            <option value="Active">Active</option>
                            <option value="Resigned">Resigned</option>
                            <option value="Terminated">Terminated</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="employmentType">Employment Type *</label>
                        <select id="employmentType" name="employmentType" required>
                            <option value="Regular">Regular</option>
                            <option value="Fixed">Fixed (No Late/Undertime/OT)</option>
                            <option value="Job Order">Job Order</option>
                            <option value="Probationary">Probationary</option>
                            <option value="Contractual">Contractual</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="payType">Pay Type *</label>
                        <select id="payType" name="payType" required>
                            <option value="monthly">Monthly</option>
                            <option value="semi-monthly">Semi-monthly</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="basicSalary">Basic Salary *</label>
                        <input type="number" id="basicSalary" name="basicSalary" required min="0" step="0.01"
                            placeholder="0.00">     
                    </div>
                    <div class="form-group">
                        <label for="allowance">Allowance</label>
                        <input type="number" id="allowance" name="allowance" min="0" step="0.01"
                            placeholder="0.00" value="0">
                    </div>
                    <div class="form-group">
                        <label for="otMultiplier">OT Multiplier *</label>
                        <select id="otMultiplier" name="otMultiplier" required>
                            <option value="1.0" selected>1.0x</option>
                            <option value="1.25">1.25x</option>
                        </select>
                        <small>Multiplier applied to hourly rate for overtime hours.</small>
                    </div>
                    <div class="form-group checkbox-group">
                        <label class="checkbox-label"><input type="checkbox" name="holidayPayEligible" value="true" /> Holiday Pay Eligible</label>
                        <small>If checked, this employee receives 2x pay on regular holidays.</small>
                    </div>
                </div>

                <h3>Gov't & Bank</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label for="tin">TIN *</label>
                        <input type="text" id="tin" name="tin" required>
                    </div>
                    <div class="form-group">
                        <label for="sssNumber">SSS Number *</label>
                        <input type="text" id="sssNumber" name="sssNumber" required>
                    </div>
                    <div class="form-group">
                        <label for="philhealthNumber">Philhealth Number *</label>
                        <input type="text" id="philhealthNumber" name="philhealthNumber" required>
                    </div>
                    <div class="form-group">
                        <label for="pagibigNumber">Pag-ibig Number *</label>
                        <input type="text" id="pagibigNumber" name="pagibigNumber" required>
                    </div>
                    <div class="form-group">
                        <label for="bank_Account">Bank Account *</label>
                        <input type="text" id="bank_Account" name="bank_Account" required>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-apply"><i class="fa-solid fa-plus"></i> Add Employee</button>
                    <a href="/admin/employees" class="btn-reset"
                        style="text-decoration:none;display:inline-flex;align-items:center;gap:8px;">Cancel</a>
                </div>
            </form>
        </section>
    </div>
    <script src="/js/nav.js"></script>
    <script>
        document.getElementById('departmentId').addEventListener('change', function() {
            if (this.value === 'ADD_NEW') {
                const newDeptName = prompt('Enter new department name:');
                if (newDeptName) {
                    fetch('/api/departments', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ departmentName: newDeptName })
                    })
                    .then(res => {
                        if(res.ok) return res.json();
                        throw new Error('Failed to create department');
                    })
                    .then(data => {
                        const newOption = new Option(data.departmentName, data.departmentId, true, true);
                        this.insertBefore(newOption, this.querySelector('option[value="ADD_NEW"]'));
                    })
                    .catch(err => {
                        alert(err.message);
                        this.value = '';
                    });
                } else {
                    this.value = '';
                }
            }
        });

        document.getElementById('positionId').addEventListener('change', function() {
            if (this.value === 'ADD_NEW') {
                const newPosName = prompt('Enter new position name:');
                if (newPosName) {
                    fetch('/api/positions', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ positionName: newPosName })
                    })
                    .then(res => {
                        if(res.ok) return res.json();
                        throw new Error('Failed to create position');
                    })
                    .then(data => {
                        const newOption = new Option(data.positionName, data.positionId, true, true);
                        this.insertBefore(newOption, this.querySelector('option[value="ADD_NEW"]'));
                    })
                    .catch(err => {
                        alert(err.message);
                        this.value = '';
                    });
                } else {
                    this.value = '';
                }
            }
        });
    </script>
</body>

</html>

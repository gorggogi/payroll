<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Welcome to Digital8</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px; }
        .setup-email-card { background-color: #ffffff; padding: 30px; border-radius: 8px; max-width: 600px; margin: 0 auto; }
        .setup-email-card h2 { text-align: center; color: #333333; }
        .setup-email-intro { font-size: 16px; color: #555555; }
        .setup-email-note { font-size: 14px; color: #777777; }
        .setup-email-cta-wrap { text-align: center; margin: 30px 0; }
        .setup-email-cta { background-color: #000000; color: #ffffff; padding: 12px 24px; text-decoration: none; border-radius: 5px; font-weight: bold; display: inline-block; }
    </style>
</head>
<body>
    <div class="setup-email-card">
        <h2>Welcome to Digital8!</h2>
        <p class="setup-email-intro">Hello <span th:text="${name}">Employee</span>,</p>
        <p class="setup-email-intro">Your employee account has been created. To securely access your dashboard, please set up your permanent password by clicking the button below.</p>
        <div class="setup-email-cta-wrap">
            <a th:href="${setupLink}" class="setup-email-cta">Set Up My Password</a>
        </div>
        <p class="setup-email-note"><em>Note: For security reasons, this link will expire in 24 hours.</em></p>
    </div>
</body>
</html>

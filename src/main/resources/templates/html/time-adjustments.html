<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time adjustments</title>
    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/css/homeAdmin.css" />
    <link rel="stylesheet" href="/css/nav.css" />
    <link rel="stylesheet" href="/css/time-adjustments.css" />
    <link rel="icon" type="image/webp" th:href="@{/images/cropped-D8-black-4.webp}">
    <script src="https://kit.fontawesome.com/b80e3de11b.js" crossorigin="anonymous"></script>
    
</head>
<body>
    <div class="container">
        <nav th:replace="~{html/fragments/nav :: sidebar}"></nav>

        <section>
            <div class="head">
                <h1>Adjustments <span th:if="${employeeName != null and !employeeName.isEmpty()}">â€” <span th:text="${employeeName}">Name</span></span></h1>
            </div>

            <p th:if="${successMessage}" class="flash-msg success" th:text="${successMessage}"></p>
            <p th:if="${errorMessage}" class="flash-msg error" th:text="${errorMessage}"></p>

            <div class="adjust-panel">
                <h2><i class="fa-solid fa-upload"></i> Upload Biometrics DTR</h2>
                <p class="adjust-panel-desc">
                    Sample format to put here.
                </p>

                <form method="post"
                      th:action="@{/admin/attendance/time-adjustments/upload}"
                      enctype="multipart/form-data">
                    <div class="adjust-form-grid">
                        <label class="input-file">
                            Biometrics file
                            <input type="file" name="file" accept=".csv,.txt,.dat" required />
                        </label>
                        <label class="overwrite-checkbox">
                            <span>Overwrite existing attendance</span>
                            <input type="checkbox" name="overwrite" value="true" checked />
                        </label>
                            <div class="adjust-form-grid-row">
                                <div class="adjust-panel-btn">
                                    <button type="submit" class="btn-import">
                                        <i class="fa-solid fa-file-import"></i> Import DTR
                                    </button>
                                </div>
                            </div>
                    </div>
                </form>

                <div th:if="${uploadImportSummary != null}" class="adjust-import-summary">
                    <strong>Import summary:</strong>
                    <pre class="adjust-import-summary-pre" th:text="${uploadImportSummary}"></pre>
                </div>
            </div>
        </section>
    </div>
    <script src="/js/nav.js"></script>
    <script>
       
    </script>
</body>
</html>

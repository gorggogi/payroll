<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital8 Payroll System</title>
    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/css/index.css" />
</head>
<body>
    <div>
        <section class="left-section">
            <h1>Welcome to Digital8 Payroll System</h1>
            <p>This Payroll System is a comprehensive solution for managing employee payroll, attendance, and human resources. Streamline your payroll operations with our powerful and easy-to-use platform.</p>
        </section>

        <section class="right-section">
            <form action="/login" method="post">
                <h1>Log in</h1>
                
                <p th:if="${error}" style="color: red; font-size: 14px; margin-bottom: 10px;">
                    <strong th:text="${error}"></strong>
                </p>
                
                <input type="email" name="email" placeholder="Email" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit">Submit</button>
                <a href="/forgotPassword">Forgot Password?</a>
            </form>
        </section>
    </div>
</body>
</html>

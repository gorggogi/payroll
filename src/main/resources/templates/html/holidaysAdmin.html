<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holiday Calendar</title>
    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/css/homeAdmin.css" />
    <link rel="stylesheet" href="/css/nav.css" />
    <link rel="stylesheet" href="/css/holidays.css" />
    <link rel="stylesheet" href="/css/settings.css" />
    <link rel="icon" type="image/webp" th:href="@{/images/cropped-D8-black-4.webp}">
    <script src="https://kit.fontawesome.com/b80e3de11b.js" crossorigin="anonymous"></script>
</head>

<body>
    <div class="container">
        <nav th:replace="~{html/fragments/nav :: sidebar}"></nav>

        <section>
            <div class="head">
                <h1>Holiday Calendar</h1>
                <p>
                    Hello, <span th:text="${employeeName != null ? employeeName : 'Admin'}">Admin</span>!
                    <i class="fa-solid fa-circle-user"></i>
                </p>
            </div>

            <div th:if="${successMessage}" class="alert-success">
                <p th:text="${successMessage}"></p>
            </div>
            <div th:if="${errorMessage}" class="alert-error">
                <p th:text="${errorMessage}"></p>
            </div>

            <!-- Filter Modal -->
            <div id="filterModal" class="holiday-modal">
                <div class="holiday-modal-content">
                    <div class="holiday-modal-header">
                        <h3>Filter Holidays</h3>
                        <button type="button" class="holiday-modal-close"
                            onclick="closeHolidayModal('filterModal')">&times;</button>
                    </div>
                    <form method="get" action="/admin/holidays">
                        <div class="form-row">
                            <div>
                                <label for="year">Year</label>
                                <select id="year" name="year">
                                    <option th:each="y : ${yearOptions}" th:value="${y}" th:text="${y}"
                                        th:selected="${y == selectedYear}"></option>
                                </select>
                            </div>
                            <div>
                                <label for="type">Type</label>
                                <select id="type" name="type">
                                    <option value="">All</option>
                                    <option value="UNCLASSIFIED" th:selected="${selectedType == 'UNCLASSIFIED'}">
                                        Unclassified</option>
                                    <option th:each="t : ${holidayTypes}" th:value="${t}" th:text="${t}"
                                        th:selected="${t == selectedType}"></option>
                                </select>
                            </div>
                        </div>
                        <div class="holiday-modal-actions">
                            <button type="button" onclick="closeHolidayModal('filterModal')">Cancel</button>
                            <button type="submit">Apply Filter</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Add Holiday Modal -->
            <div id="addHolidayModal" class="holiday-modal">
                <div class="holiday-modal-content">
                    <div class="holiday-modal-header">
                        <h3>Add Holiday</h3>
                        <button type="button" class="holiday-modal-close"
                            onclick="closeHolidayModal('addHolidayModal')">&times;</button>
                    </div>
                    <form method="post" action="/admin/holidays">
                        <div class="form-row">
                            <div>
                                <label for="holidayName">Holiday Name</label>
                                <input id="holidayName" name="holidayName" placeholder="Holiday name" required />
                            </div>
                            <div>
                                <label for="holidayDate">Holiday Date</label>
                                <input id="holidayDate" type="date" name="holidayDate" required />
                            </div>
                            <div>
                                <label for="holidayType">Holiday Type</label>
                                <select id="holidayType" name="holidayType">
                                    <option value="">Unclassified</option>
                                    <option th:each="t : ${holidayTypes}" th:value="${t}" th:text="${t}"></option>
                                </select>
                            </div>
                        </div>
                        <div class="holiday-modal-actions">
                            <button type="button" onclick="closeHolidayModal('addHolidayModal')">Cancel</button>
                            <button type="submit">Add Holiday</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="holiday-list-wrapper">
                <div class="holiday-header">
                    <h2>Holiday List</h2>
                    <div class="holiday-action-bar">
                        <button type="button" class="holiday-fab-btn" onclick="openHolidayModal('filterModal')">
                            <i class="fa-solid fa-filter"></i> Filters
                        </button>
                        <button type="button" class="holiday-fab-btn" onclick="openHolidayModal('addHolidayModal')">
                            <i class="fa-solid fa-plus"></i> Add Holiday
                        </button>
                    </div>
                </div>
                <table class="holiday-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Name</th>
                            <th>Type</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="h : ${holidays}">
                            <td th:text="${h.holidayDate}"></td>
                            <td th:text="${h.holidayName}"></td>
                            <td>
                                <form th:action="@{/admin/holidays/{id}/update(id=${h.holidayId})}" method="post"
                                    style="display:inline;">
                                    <input type="hidden" name="holidayName" th:value="${h.holidayName}" />
                                    <input type="hidden" name="holidayDate" th:value="${h.holidayDate}" />

                                    <select name="holidayType" onchange="this.form.submit()">
                                        <option value="" th:selected="${h.holidayType == null || h.holidayType == ''}">
                                            Unclassified</option>
                                        <option value="REGULAR" th:selected="${h.holidayType == 'REGULAR'}">Regular
                                        </option>
                                        <option value="SPECIAL_NON_WORKING"
                                            th:selected="${h.holidayType == 'SPECIAL_NON_WORKING'}">Special Non-Working
                                        </option>
                                        <option value="SPECIAL_WORKING"
                                            th:selected="${h.holidayType == 'SPECIAL_WORKING'}">
                                            Special Working</option>
                                    </select>
                                </form>
                            </td>
                            <td>
                                <button type="button" th:attr="data-holiday-id=${h.holidayId},
                                         data-holiday-name=${h.holidayName},
                                         data-holiday-date=${h.holidayDate},
                                         data-holiday-type=${#strings.defaultString(h.holidayType, '')}"
                                    onclick="openEditHolidayModal(this)">
                                    <i class="fa-solid fa-pen-to-square"></i>
                                </button>
                                <form th:action="@{/admin/holidays/{id}/delete(id=${h.holidayId})}" method="post"
                                    style="display:inline" onsubmit="return confirm('Delete this holiday?');">
                                    <button type="submit"><i class="fa-solid fa-trash"></i></button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
                <div class="holiday-fab-bar">
                    <button type="button" class="holiday-fab-btn" onclick="openHolidayModal('copyYearModal')">
                        Copy Previous Year
                    </button>
                    <button type="button" class="holiday-fab-btn" onclick="openHolidayModal('importCsvModal')">
                        Import CSV
                    </button>
                </div>
            </div>
            <!-- Copy Year Modal -->
            <div id="copyYearModal" class="holiday-modal">
                <div class="holiday-modal-content">
                    <div class="holiday-modal-header">
                        <h3>Copy Previous Year</h3>
                        <button type="button" class="holiday-modal-close"
                            onclick="closeHolidayModal('copyYearModal')">&times;</button>
                    </div>
                    <form method="post" action="/admin/holidays/copy-year">

                        <div class="form-row">
                            <div>
                                <label for="sourceYearModal">Source Year</label>
                                <input id="sourceYearModal" name="sourceYear" type="number" min="2000" max="2100"
                                    required />
                            </div>
                            <div>
                                <label for="targetYearModal">Target Year</label>
                                <input id="targetYearModal" name="targetYear" type="number" min="2000" max="2100"
                                    required />
                            </div>
                        </div>
                        <div class="holiday-modal-actions">
                            <button type="button" onclick="closeHolidayModal('copyYearModal')">Cancel</button>
                            <button type="submit">Copy Year</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Import CSV Modal -->
            <div id="importCsvModal" class="holiday-modal">
                <div class="holiday-modal-content">
                    <div class="holiday-modal-header">
                        <h3>Import CSV</h3>
                        <button type="button" class="holiday-modal-close"
                            onclick="closeHolidayModal('importCsvModal')">&times;</button>
                    </div>
                    <form method="post" action="/admin/holidays/import" enctype="multipart/form-data">

                        <div>
                            <label for="holidayCsvModal">CSV File</label>
                            <input id="holidayCsvModal" type="file" name="file" accept=".csv" required />
                        </div>
                        <small>Format: holiday_name,holiday_date,holiday_type (yyyy-MM-dd)</small>
                        <div class="holiday-modal-actions">
                            <button type="button" onclick="closeHolidayModal('importCsvModal')">Cancel</button>
                            <button type="submit">Import CSV</button>
                            <a href="/files/holidayTemplate.csv" download="holidayTemplate.csv">Download CSV
                                Template</a>
                        </div>
                    </form>
                </div>
            </div>
            <div id="editHolidayModal" class="holiday-modal">
                <div class="holiday-modal-content">
                    <div class="holiday-modal-header">
                        <h3>Edit Holiday</h3>
                        <button type="button" class="holiday-modal-close"
                            onclick="closeHolidayModal('editHolidayModal')">&times;</button>
                    </div>
                    <form id="editHolidayForm" method="post">
                        <div class="form-row">
                            <div>
                                <label for="editHolidayName">Holiday Name</label>
                                <input id="editHolidayName" name="holidayName" type="text" required />
                            </div>
                            <div>
                                <label for="editHolidayDate">Holiday Date</label>
                                <input id="editHolidayDate" name="holidayDate" type="date" required />
                            </div>
                            <div>
                                <label for="editHolidayType">Holiday Type</label>
                                <select id="editHolidayType" name="holidayType">
                                    <option value="">Unclassified</option>
                                    <option value="REGULAR">Regular</option>
                                    <option value="SPECIAL_NON_WORKING">Special Non-Working</option>
                                    <option value="SPECIAL_WORKING">Special Working</option>
                                </select>
                            </div>

                        </div>
                        <div class="holiday-modal-actions">
                            <button type="button" onclick="closeHolidayModal('editHolidayModal')">Cancel</button>
                            <button type="submit">Save Changes</button>
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </div>

    <script src="/js/nav.js"></script>
    <script src="/js/holiday.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overtime</title>
    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/css/homeAdmin.css" />
    <link rel="stylesheet" href="/css/nav.css" />
    <link rel="icon" type="image/webp" th:href="@{/images/cropped-D8-black-4.webp}">
    <script src="https://kit.fontawesome.com/b80e3de11b.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="container">
        <nav>
            <div class="nav-header">
                <h1><span class="nav-brand">Payroll System</span></h1>
                <button class="nav-toggle" id="navToggle" type="button" aria-label="Toggle navigation"><i class="fa-solid fa-chevron-left"></i></button>
            </div>
            <ul>
                <a href="/admin/home" title="Home"><li><i class="fa-solid fa-house"></i><span class="nav-label">Home</span></li></a>
                <a href="/admin/employees" title="Employees"><li><i class="fa-solid fa-people-group"></i><span class="nav-label">Employees</span></li></a>

                <!-- Attendance group -->
                <a title="Attendance" class="nav-dropdown-toggle active">
                    <i class="fa-solid fa-calendar"></i>
                    <span class="nav-label">Attendance</span>
                    <i class="fa-solid fa-chevron-down nav-dropdown-icon"></i>
                </a>
                <ul class="nav-dropdown-menu">
                    <li><a th:href="@{/admin/attendance}">Daily Time Record</a></li>
                    <li><a href="/admin/leave" title="Leave">
                        <span class="nav-label">Leave</span>
                        <span id="leave-nav-indicator" data-nav-indicator="leave" class="nav-indicator" title="Pending leave requests" aria-label="Pending leave requests" th:style="${pendingLeaveCount > 0} ? '' : 'display:none'">
                            <i class="fa-solid fa-circle-exclamation"></i>
                        </span>
                    </a></li>
                    <li class="active"><a th:href="@{/admin/attendance/overtime}">Overtime</a></li>
                    <li><a th:href="@{/admin/attendance/time-adjustments}">Adjustments</a></li>
                    <li><a th:href="@{/admin/attendance/shifts}">Shifting</a></li>
                </ul>

                <!-- Payroll group -->
                <a title="Payroll" class="nav-dropdown-toggle">
                    <i class="fa-solid fa-money-bill"></i>
                    <span class="nav-label">Payroll</span>
                    <i class="fa-solid fa-chevron-down nav-dropdown-icon"></i>
                </a>
                <ul class="nav-dropdown-menu">
                    <li><a th:href="@{/payroll/{id}(id=${emp_id})}" href="#">Payroll</a></li>
                    <li><a href="/admin/deductions">Deductions</a></li>
                    <li><a href="/admin/adjustments">Adjustments</a></li>
                </ul>

                <a href="/admin/settings" title="Settings"><li><i class="fa-solid fa-gear"></i><span class="nav-label">Settings</span></li></a>
            </ul>
            <a href="/logout" class="logout" title="Logout"><i class="fa-solid fa-right-from-bracket"></i><span class="nav-label">Logout</span></a>
        </nav>

        <section>
            <div class="head">
                <h1>Overtime</h1>
            </div>

        </section>
    </div>
    <script src="/js/nav.js"></script>
</body>
</html>

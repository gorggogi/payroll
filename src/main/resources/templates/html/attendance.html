<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance</title>
      <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/css/homeAdmin.css" />
    <link rel="stylesheet" href="/css/attendance.css" />
    <script src="https://kit.fontawesome.com/b80e3de11b.js" crossorigin="anonymous"></script>

</head>
<body>
     <div class="container">
        <nav>
            <ul>
                <h1>Payroll System</h1>
                <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/home}"><li><i class="fa-solid fa-house"></i>Home</li></a>
                <a sec:authorize="hasRole('EMPLOYEE')" th:href="@{/employee/home}"><li><i class="fa-solid fa-house"></i>Home</li></a>
                <a sec:authorize="hasRole('ADMIN')"  href="/admin/employees"><li><i class="fa-solid fa-people-group"></i>Employees</li></a>
                <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/attendance}"><li class="active"><i class="fa-solid fa-calendar"></i>Attendance</li></a>
                <a sec:authorize="hasRole('EMPLOYEE')" th:href="@{/employee/attendance}"><li class="active"><i class="fa-solid fa-calendar"></i>Attendance</li></a>

                <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/settings}"><li><i class="fa-solid fa-gear"></i>Settings</li></a>
                <a sec:authorize="hasRole('EMPLOYEE')" th:href="@{/employee/settings}"><li><i class="fa-solid fa-gear"></i>Settings</li></a>
            </ul>
            
            <a href="/logout" class="logout"><i class="fa-solid fa-right-from-bracket"></i>Logout</a>

        </nav>
    <section>
        <div class="head">
            <h1>Attendance</h1>
            <p>
                Hello, <span th:text="${employeeName}"></span>!
                <i class="fa-solid fa-circle-user"></i>
            </p>
        </div>
          <table class="attendanceTable">
  <caption>Attendance for the month of  
    <select name="Month" id="month">
        <option value="January">January</option>
        <option value="February">February</option>
        <option value="March">March</option>
        <option value="April">April</option>
        <option value="May">May</option>
        <option value="June">June</option>
        <option value="July">July</option>
        <option value="August">August</option>
        <option value="September">September</option>
        <option value="October">October</option>
        <option value="November">November</option>
        <option value="December">December</option>
    </select>
      year
  </caption>
    <tr class="attendanceHeader">
    <th>Date</th>
    <th>Time in</th>
    <th>Time out</th>
    <th>Work Hours</th>
    <th>Late Minutes</th>
    <th>Overtime Hours</th>
    </tr>
    </thead>
    <tbody class="attendanceBody" th:if="${attendances}">
        <tr th:each="a : ${attendances}">
            <td th:text="${a.attendance_date}"></td>
            <td th:text="${a.time_in}"></td>
            <td th:text="${a.time_out}"></td>
            <td th:text="${a.work_hours}"></td>
            <td th:text="${a.late_minutes}"></td>
            <td th:text="${a.overtime_hours}"></td>
        </tr>
    </tbody>

</table>
Total Hours Rendered: 
   
    </div>
    

    </section>
    </div>
   
</body>
</html>

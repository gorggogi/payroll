<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance</title>
    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/css/homeAdmin.css" />
    <link rel="stylesheet" href="/css/nav.css" />
    <link rel="stylesheet" href="/css/attendance.css" />
    <link rel="icon" type="image/webp" th:href="@{/images/cropped-D8-black-4.webp}">
    <script src="https://kit.fontawesome.com/b80e3de11b.js" crossorigin="anonymous"></script>

</head>

<body>
    <div class="container">
        <nav th:replace="~{html/fragments/nav :: sidebar}"></nav>
        <section>
            <div class="head">
                <h1>Attendance of <span th:text="${employeeName}">User</span></h1>
                <div class="head-actions no-print" style="display: flex; gap: 0.5rem; align-items: center;">
                    <button type="button" class="btn-edit-shift" id="toggleShiftEditBtn" onclick="toggleShiftEdit()">
                        <i class="fa-solid fa-pen"></i> Edit Shift
                    </button>
                    <button type="button" class="btn-edit-shift save-btn" id="saveShiftBtn" style="display:none;" onclick="saveAllShiftChanges()">
                        <i class="fa-solid fa-check"></i> Save Changes
                    </button>
                    <button type="button" class="btn-print" onclick="window.print()">
                        <i class="fa-solid fa-print"></i> Print
                    </button>
                </div>
            </div>

            <form method="get" th:action="${attendanceFormAction}" id="attendanceFilterForm"
                class="attendance-filter no-print">
                <input type="hidden" name="empId" th:value="${viewingEmployeeId}"
                    th:if="${viewingEmployeeId != null}" />
                <label for="month">Month</label>
                <select name="month" id="month" onchange="this.form.submit()">
                    <option value="1" th:selected="${selectedMonth == 1}">January</option>
                    <option value="2" th:selected="${selectedMonth == 2}">February</option>
                    <option value="3" th:selected="${selectedMonth == 3}">March</option>
                    <option value="4" th:selected="${selectedMonth == 4}">April</option>
                    <option value="5" th:selected="${selectedMonth == 5}">May</option>
                    <option value="6" th:selected="${selectedMonth == 6}">June</option>
                    <option value="7" th:selected="${selectedMonth == 7}">July</option>
                    <option value="8" th:selected="${selectedMonth == 8}">August</option>
                    <option value="9" th:selected="${selectedMonth == 9}">September</option>
                    <option value="10" th:selected="${selectedMonth == 10}">October</option>
                    <option value="11" th:selected="${selectedMonth == 11}">November</option>
                    <option value="12" th:selected="${selectedMonth == 12}">December</option>
                </select>
                <label for="year">Year</label>
                <select name="year" id="year" onchange="this.form.submit()">
                    <option th:each="y : ${years}" th:value="${y}" th:text="${y}" th:selected="${y == selectedYear}">
                    </option>
                </select>
            </form>

            <table class="attendanceTable">
                <caption>Attendance for <span th:text="${captionMonthYear}">Month Year</span></caption>
                <thead>
                    <tr class="attendanceHeader">
                        <th>Date</th>
                        <th>Shift Used</th>
                        <th>Time in</th>
                        <th>Time out</th>
                        <th>Work Hours</th>
                        <th>Late Minutes</th>
                        <th>Undertime Minutes</th>
                        <th>Overtime Hours</th>
                    </tr>
                </thead>
                <tbody class="attendanceBody" th:if="${attendances}">
                    <tr th:each="a : ${attendances}">
                        <td th:text="${a.attendance_date}"></td>
                        <td class="shift-cell" th:data-attendance-id="${a.attendanceId}">
                            <span class="shift-text" th:text="${shiftLabelByDate != null and shiftLabelByDate.get(a.attendance_date) != null ? shiftLabelByDate.get(a.attendance_date) : 'No shift'}"></span>
                            <div class="shift-edit-row no-print" style="display: none; gap: 4px; align-items: center;">
                                <input type="time" class="shift-time-in" th:data-attendance-id="${a.attendanceId}" />
                                <span style="font-size: 11px; color: #666;">to</span>
                                <input type="time" class="shift-time-out" th:data-attendance-id="${a.attendanceId}" />
                            </div>
                        </td>
                        <td th:text="${a.timeInDisplay}"></td>
                        <td th:text="${a.timeOutDisplay}"></td>
                        <td th:text="${a.workHoursDisplay}"></td>
                        <td th:text="${a.late_minutes}"></td>
                        <td th:text="${a.undertime_minutes != null ? a.undertime_minutes : 0}"></td>
                        <td th:text="${a.overtimeHoursDisplay}"></td>
                    </tr>
                </tbody>
            </table>

            <form id="shiftEditForm" action="/admin/attendance/shift/edit" method="post" style="display: none;">
                <input type="hidden" name="month" th:value="${selectedMonth}" />
                <input type="hidden" name="year" th:value="${selectedYear}" />
                <input type="hidden" name="empId" th:value="${viewingEmployeeId}" />
            </form>

            <p class="total-hours">Total Hours Rendered: <strong
                    th:text="${totalHoursRenderedDisplay != null ? totalHoursRenderedDisplay : '0:00'}">0:00</strong>
            </p>
            <p class="total-hours">Total Undertime: <strong
                    th:text="${totalUndertimeMinutes != null ? totalUndertimeMinutes : 0}">0</strong> mins
            </p>
            <!-- Contextual link: go to the payroll of the employee currently being viewed -->
            <a th:href="@{/payroll/{id}(id=${emp_id})}" href="#" class="card-link no-print">View Payroll &rarr;</a>

        </section>
    </div>
    <script src="/js/nav.js"></script>
    <script>
        let shiftEditMode = false;

        function toggleShiftEdit() {
            shiftEditMode = !shiftEditMode;
            var btn = document.getElementById('toggleShiftEditBtn');
            var textSpans = document.querySelectorAll('.shift-text');
            var editRows = document.querySelectorAll('.shift-edit-row');
            var saveBtn = document.getElementById('saveShiftBtn');

            if (shiftEditMode) {
                btn.classList.add('active');
                btn.innerHTML = '<i class="fa-solid fa-times"></i> Cancel';
                textSpans.forEach(function(span) { span.style.display = 'none'; });
                editRows.forEach(function(row) {
                    row.style.display = 'flex';
                    var shiftCell = row.closest('.shift-cell');
                    var textEl = shiftCell ? shiftCell.querySelector('.shift-text') : null;
                    if (textEl) {
                        prefillShiftInputs(row, textEl.textContent.trim());
                    }
                });
                saveBtn.style.display = 'inline-flex';
            } else {
                btn.classList.remove('active');
                btn.innerHTML = '<i class="fa-solid fa-pen"></i> Edit Shift';
                textSpans.forEach(function(span) { span.style.display = ''; });
                editRows.forEach(function(row) { row.style.display = 'none'; });
                saveBtn.style.display = 'none';
            }
        }

        function to24h(time, ampm) {
            var parts = time.split(':');
            var h = parseInt(parts[0], 10);
            var m = parts[1];
            ampm = ampm.toUpperCase();
            if (ampm === 'PM' && h !== 12) h += 12;
            if (ampm === 'AM' && h === 12) h = 0;
            return (h.toString().padStart(2, '0') + ':' + m);
        }

        function saveAllShiftChanges() {
            var form = document.getElementById('shiftEditForm');
            var editRows = document.querySelectorAll('.shift-edit-row');
            editRows.forEach(function(row) {
                var attId = row.querySelector('.shift-time-in').getAttribute('data-attendance-id');
                var timeIn = row.querySelector('.shift-time-in').value;
                var timeOut = row.querySelector('.shift-time-out').value;
                var attInput = document.createElement('input');
                attInput.type = 'hidden';
                attInput.name = 'attendanceId';
                attInput.value = attId;
                form.appendChild(attInput);
                var inInput = document.createElement('input');
                inInput.type = 'hidden';
                inInput.name = 'shiftIn';
                inInput.value = timeIn;
                form.appendChild(inInput);
                var outInput = document.createElement('input');
                outInput.type = 'hidden';
                outInput.name = 'shiftOut';
                outInput.value = timeOut;
                form.appendChild(outInput);
            });
            form.submit();
        }

        function prefillShiftInputs(row, shiftText) {
            var match = shiftText.match(/(\d{1,2}):(\d{2})\s*(AM|PM)?\s*-\s*(\d{1,2}):(\d{2})\s*(AM|PM)?/i);
            if (match) {
                var inH = parseInt(match[1], 10);
                var inM = match[2];
                var outH = parseInt(match[4], 10);
                var outM = match[5];
                if (match[3]) {
                    var ampm1 = match[3].toUpperCase();
                    if (ampm1 === 'PM' && inH !== 12) inH += 12;
                    if (ampm1 === 'AM' && inH === 12) inH = 0;
                }
                if (match[6]) {
                    var ampm2 = match[6].toUpperCase();
                    if (ampm2 === 'PM' && outH !== 12) outH += 12;
                    if (ampm2 === 'AM' && outH === 12) outH = 0;
                }
                row.querySelector('.shift-time-in').value = String(inH).padStart(2, '0') + ':' + inM;
                row.querySelector('.shift-time-out').value = String(outH).padStart(2, '0') + ':' + outM;
            }
        }
    </script>
</body>

</html>

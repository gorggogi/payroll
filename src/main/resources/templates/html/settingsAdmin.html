<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/css/homeAdmin.css" />
    <link rel="stylesheet" href="/css/settings.css" />
    <link rel="icon" type="image/webp" th:href="@{/images/cropped-D8-black-4.webp}">
    <script src="https://kit.fontawesome.com/b80e3de11b.js" crossorigin="anonymous"></script>
    <title>Settings</title>
</head>
<body>
    <div class="container">
        <nav>
            <ul>
                <h1>Payroll System</h1>
                <a href="/admin/home"><li><i class="fa-solid fa-house"></i>Home</li></a>
                <a href="/admin/employees"><li><i class="fa-solid fa-people-group"></i>Employees</li></a>
                <a href="/admin/attendance"><li><i class="fa-solid fa-calendar"></i>Attendance</li></a>
                <a href="/admin/deductions"><li><i class="fa-solid fa-minus-circle"></i>Deductions</li></a>
                <a th:href="@{/payroll/{id}(id=${emp_id})}" href="#"><li><i class="fa-solid fa-money-bill"></i>Payroll</li></a>
                <a href="/admin/leave"><li><i class="fa-solid fa-calendar"></i>Leave</li></a>
                <a href="/admin/settings"><li class="active"><i class="fa-solid fa-gear"></i>Settings</li></a>
            </ul>
            
            <a href="/logout" class="logout"><i class="fa-solid fa-right-from-bracket"></i>Logout</a>
        </nav>
        
        <section>
            <div class="head">
                <h1>Settings</h1>
                <p>
                    Hello, <span th:text="${employeeName}">Employee</span>!
                    <i class="fa-solid fa-circle-user"></i>
                </p>
            </div>
            
            <div th:if="${successMessage}" class="alert-success">
                <p th:text="${successMessage}"></p>
            </div>
            <div th:if="${errorMessage}" class="alert-error">
                <p th:text="${errorMessage}"></p>
            </div>

            <div class="settings-card">
                <h2>Edit Profile</h2>
                <form action="/admin/settings/profile" method="POST">
                    <div>
                        <label for="firstName">First Name:</label>
                        <input type="text" id="firstName" name="firstName" th:value="${employee.firstName}" required />
                    </div>
                    <div>
                        <label for="lastName">Last Name:</label>
                        <input type="text" id="lastName" name="lastName" th:value="${employee.lastName}" required />
                    </div>
                    <div>
                        <label for="middleName">Middle Name:</label>
                        <input type="text" id="middleName" name="middleName" th:value="${employee.middleName}" />
                    </div>
                    <div>
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" th:value="${user.email}" required />
                    </div>
                    <div>
                        <label for="employeeNumber">Employee Number:</label>
                        <input type="text" id="employeeNumber" name="employeeNumber" th:value="${employee.employeeNumber}" required />
                    </div>
                    <div>
                        <label for="contactNumber">Contact Number:</label>
                        <input type="text" id="contactNumber" name="contactNumber" th:value="${employee.contactNumber}" />
                    </div>
                    <div>
                        <label for="address">Address:</label>
                        <input type="text" id="address" name="address" th:value="${employee.address}" />
                    </div>
                    <p style="color:#666; font-size:0.9rem;">Department, position, and date hired are read-only.</p>
                    <button type="submit">Save Profile</button>
                </form>
            </div>

            <div class="settings-card">
                <h2>Change Password</h2>
                <form action="/admin/settings/change-password" method="POST">
                    <div>
                        <label for="currentPassword">Current Password:</label>
                        <input type="password" id="currentPassword" name="currentPassword" required />
                    </div>
                    
                    <div>
                        <label for="newPassword">New Password:</label>
                        <input type="password" id="newPassword" name="newPassword" required minlength="6" />
                    </div>
                    
                    <div>
                        <label for="confirmPassword">Confirm New Password:</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" required />
                    </div>
                    
                    <button type="submit">Update Password</button>
                </form>
            </div>
        </section>
    </div>
</body>
</html>

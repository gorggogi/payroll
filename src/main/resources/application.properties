spring.application.name=payroll
app.base-url=${APP_BASE_URL:http://localhost:8080}
# zeroDateTimeBehavior: legacy DB rows may use 0000-00-00; driver otherwise throws "Zero date value prohibited"
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/payroll?zeroDateTimeBehavior=CONVERT_TO_NULL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.jpa.hibernate.ddl-auto=none


spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


spring.application.name=payroll
spring.datasource.url=jdbc:mysql://localhost:3306/payroll
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none


spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# Explicit Hibernate dialect to avoid "Unable to determine Dialect" when JDBC metadata
# (useful if the DB isn't reachable at bootstrap or metadata can't be obtained)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect